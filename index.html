<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Póster AR</title>

  <!-- Versiones fijas para que el proyecto no se rompa si salen actualizaciones -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!--
    Componente "video-blend": en vez de pintar el video plano y opaco (como hace <a-video>),
    lo dibuja con un shader propio que:
      1) difumina los bordes (feather) para que no se vea como un rectángulo pegado encima,
      2) le agrega un grano sutil, como si fuera parte de la imagen de la cámara,
      3) ajusta el brillo del video según la luz real del entorno (mide el brillo promedio
         del video de la cámara que usa MindAR y lo va siguiendo suavemente).
    Se registra ACÁ, antes de <a-scene>, para que exista antes de que la escena lo use.
  -->
  <script>
    AFRAME.registerComponent('video-blend', {
      schema: {
        width:    { type: 'number', default: 1 },
        height:   { type: 'number', default: 1 },
        // feather: qué tan ancho es el difuminado del borde (0 = sin difuminar, en UV 0..1)
        // bien chico a propósito: apenas suaviza el borde duro, sin comerse detalle de la gráfica
        feather:  { type: 'number', default: 0.012 },
        // grain: intensidad del grano/textura (0 = sin grano)
        grain:    { type: 'number', default: 0.035 },
      },

      init: function () {
        const videoEl = document.querySelector('#video-poster');
        const texture = new THREE.VideoTexture(videoEl);

        this.uniforms = {
          map:        { value: texture },
          uBrightness:{ value: 1.0 },
          uTime:      { value: 0 },
          uFeather:   { value: this.data.feather },
          uGrain:     { value: this.data.grain },
        };

        const material = new THREE.ShaderMaterial({
          uniforms: this.uniforms,
          transparent: true,
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            varying vec2 vUv;
            uniform sampler2D map;
            uniform float uBrightness;
            uniform float uTime;
            uniform float uFeather;
            uniform float uGrain;

            float ruido(vec2 co) {
              return fract(sin(dot(co, vec2(12.9898, 78.233)) + uTime) * 43758.5453);
            }

            void main() {
              vec4 tex = texture2D(map, vUv);

              // difuminado del borde: se desvanece hacia los 4 bordes del video
              vec2 d = min(vUv, 1.0 - vUv);
              float borde = min(d.x, d.y);
              float alpha = smoothstep(0.0, uFeather, borde);

              // grano sutil, como ruido de sensor de cámara
              float g = (ruido(vUv * 600.0) - 0.5) * uGrain;

              vec3 color = tex.rgb * uBrightness + g;
              gl_FragColor = vec4(color, tex.a * alpha);
            }
          `,
        });

        const geometry = new THREE.PlaneGeometry(this.data.width, this.data.height);
        this.mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', this.mesh);

        // --- Medición de luz ambiente a partir del video real de la cámara ---
        this._sampleCanvas = document.createElement('canvas');
        this._sampleCanvas.width = 8;
        this._sampleCanvas.height = 8;
        this._sampleCtx = this._sampleCanvas.getContext('2d', { willReadFrequently: true });
        this._lastSample = 0;
        this._brillo = 1.0;
      },

      tick: function (time) {
        this.uniforms.uTime.value = time * 0.001;

        // no hace falta medir la luz en cada frame: alcanza con ~6 veces por segundo
        if (time - this._lastSample > 160) {
          this._lastSample = time;
          this._medirLuzAmbiente();
        }
      },

      _medirLuzAmbiente: function () {
        const sistema = this.el.sceneEl.systems['mindar-image-system'];
        const camVideo = sistema && sistema.video;
        if (!camVideo || camVideo.readyState < 2) return;

        try {
          this._sampleCtx.drawImage(camVideo, 0, 0, 8, 8);
          const datos = this._sampleCtx.getImageData(0, 0, 8, 8).data;
          let suma = 0;
          for (let i = 0; i < datos.length; i += 4) {
            suma += 0.2126 * datos[i] + 0.7152 * datos[i + 1] + 0.0722 * datos[i + 2];
          }
          const promedio = suma / (datos.length / 4) / 255; // 0 (oscuro) a 1 (muy iluminado)

          // se mapea a un rango que no apague ni queme el video del todo
          const objetivo = 0.65 + promedio * 0.7; // ~0.65 a ~1.35
          this._brillo += (objetivo - this._brillo) * 0.08; // suavizado, para que no titile
          this.uniforms.uBrightness.value = this._brillo;
        } catch (e) {
          // si algún navegador no deja leer el canvas, seguimos con el último brillo conocido
        }
      },
    });
  </script>

  <style>
    /* Importante: NO poner color de fondo en html/body. El video de la cámara va detrás
       del contenido y un fondo lo taparía (pantalla negra con la cámara encendida). */
    html, body { margin: 0; height: 100%; }

    /* Mensaje de error: solo aparece si algo falla */
    #aviso {
      display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20;
      padding: 14px 16px; border-radius: 12px; box-sizing: border-box;
      background: rgba(20, 22, 26, .92); color: #f2f2f2;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Instrucción: guía al usuario a apuntar al póster; desaparece cuando el video ya está andando */
    #instruccion {
      position: fixed; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
      z-index: 15; display: flex; justify-content: center; pointer-events: none;
      opacity: 0; transform: translateY(-8px);
      transition: opacity .35s ease, transform .35s ease;
    }
    #instruccion.visible { opacity: 1; transform: translateY(0); }
    #instruccion span {
      max-width: 92vw; padding: 10px 18px; border-radius: 999px; box-sizing: border-box;
      background: rgba(20, 22, 26, .82); color: #f2f2f2; text-align: center;
      font: 600 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>

  <div id="aviso" role="alert"></div>
  <div id="instruccion" aria-hidden="true"><span id="instruccion-texto"></span></div>

  <!--
    filterMinCF / filterBeta: suavizado del tracking (filtro One Euro que trae MindAR).
    Por defecto son muy conservadores (0.001 / 1) y eso es lo que hace que el video se
    sienta "flotando" detrás del movimiento real de la mano. Subirlos hace que el video
    persiga el póster más de cerca:
      - filterMinCF: suavizado base (con la mano quieta). Más alto = menos lag en reposo,
        pero más tembloroso.
      - filterBeta: qué tanto reacciona a la VELOCIDAD del movimiento. Es el que más importa
        acá: más alto = sigue mucho mejor los movimientos rápidos de la mano, a costa de un
        poco más de temblor durante el movimiento.
    Si se siente demasiado tembloroso, bajar filterBeta (ej. 300); si todavía se nota lag,
    subirlo más (ej. 2000).
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: no; filterMinCF: 0.01; filterBeta: 1000;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- "muted" permite que el video parta solo, sin toque previo, en iPhone y Android -->
      <video id="video-poster"
             src="./assets/animacion.mp4"
             preload="auto"
             loop
             muted
             playsinline
             webkit-playsinline
             crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = primera (y única) imagen dentro de targets.mind -->
    <a-entity id="objetivo" mindar-image-target="targetIndex: 0">
      <!--
        width = 1 equivale al ancho completo del póster.
        height = alto ÷ ancho de TU imagen. Ejemplos:
          Póster vertical A3/A4 (proporción 1:1.414) -> 1.414
          Póster vertical 2:3                         -> 1.5
          Póster cuadrado                             -> 1
          Póster horizontal 16:9                      -> 0.5625
      -->
      <a-entity video-blend="width: 1; height: 1.414; feather: 0.012; grain: 0.035" position="0 0 0.01"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena    = document.querySelector('a-scene');
    const video     = document.querySelector('#video-poster');
    const objetivo  = document.querySelector('#objetivo');
    const aviso     = document.querySelector('#aviso');
    const instruccion      = document.querySelector('#instruccion');
    const instruccionTexto = document.querySelector('#instruccion-texto');
    let visible = false;

    function mostrarAviso(texto) {
      aviso.textContent = texto;
      aviso.style.display = 'block';
    }

    // --- Instrucción en pantalla: guía para apuntar al póster ---
    function mostrarInstruccion(texto) {
      instruccionTexto.textContent = texto;
      instruccion.classList.add('visible');
    }

    function ocultarInstruccion() {
      instruccion.classList.remove('visible');
    }

    // --- Diagnóstico: avisa en pantalla si algo falla ---
    escena.addEventListener('arError', () => {
      mostrarAviso('No se pudo iniciar la cámara. Revisa que el navegador tenga permiso de cámara para este sitio y recarga la página.');
      ocultarInstruccion();
    });
    escena.addEventListener('arReady', () => {
      aviso.style.display = 'none';
      mostrarInstruccion('Apunta de nuevo al póster para darle vida a la experiencia');
    });

    ['./assets/targets.mind', './assets/animacion.mp4'].forEach(async (ruta) => {
      try {
        const r = await fetch(ruta, { method: 'HEAD', cache: 'no-store' });
        if (!r.ok) mostrarAviso('No se encuentra el archivo ' + ruta + ' (error ' + r.status + '). Revisa el nombre y que esté dentro de la carpeta assets.');
      } catch (e) {
        mostrarAviso('No se pudo cargar ' + ruta + '. Revisa tu conexión.');
      }
    });

    video.addEventListener('error', () => {
      mostrarAviso('El video no se pudo reproducir. Comprueba que sea un .mp4 (H.264) y que se llame animacion.mp4.');
    });

    if (typeof AFRAME === 'undefined' || typeof AFRAME.components['mindar-image'] === 'undefined') {
      mostrarAviso('No se cargaron las librerías de AR. Revisa tu conexión a internet.');
    }

    // --- Reproducción del video ---
    objetivo.addEventListener('targetFound', () => {
      visible = true;
      video.play().catch(() => {});
    });

    objetivo.addEventListener('targetLost', () => {
      visible = false;
      video.pause();
      mostrarInstruccion('Vuelve a apuntar la cámara hacia el póster');
    });

    // la instrucción solo se oculta cuando el video realmente está reproduciéndose
    // (no apenas se llama a .play(), que puede quedar a medio cargar)
    video.addEventListener('playing', ocultarInstruccion);

    // El video parte silenciado (única forma de que arranque solo).
    // Al primer toque en la pantalla se activa el sonido, si la animación lo tiene.
    function activarSonido() {
      video.muted = false;
      if (visible) video.play().catch(() => {});
      window.removeEventListener('touchend', activarSonido);
      window.removeEventListener('click', activarSonido);
    }
    window.addEventListener('touchend', activarSonido);
    window.addEventListener('click', activarSonido);
  </script>
</body>
</html>
